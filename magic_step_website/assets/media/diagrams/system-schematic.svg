<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Magic Step functional energy-conversion concept</title>
  <desc id="description">Footstep pressure flows through six piezoelectric sensors, four rectifier diodes, a 50 microfarad capacitor, boost converter, TP4056 module, and a 3.7 volt lithium-ion battery. The ESP32 monitoring and control unit is shown separately. This is not a wiring diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #f1f5f9; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #cbd5e1; }
      .step { fill: #17263d; stroke: #38bdf8; stroke-width: 2; }
      .arrow { stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="460" rx="18" fill="url(#background)"/>
  <text class="title" x="48" y="52">MAGIC STEP · FUNCTIONAL ENERGY-CONVERSION CONCEPT</text>

  <g transform="translate(36 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">Footstep</text>
    <text class="small" x="72" y="68" text-anchor="middle">Pressure</text>
  </g>
  <path class="arrow" d="M184 162h18"/>
  <g transform="translate(208 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">Piezoelectric</text>
    <text class="small" x="72" y="68" text-anchor="middle">Sensors · 6</text>
  </g>
  <path class="arrow" d="M356 162h18"/>
  <g transform="translate(380 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">Rectifier</text>
    <text class="small" x="72" y="68" text-anchor="middle">Four diodes</text>
  </g>
  <path class="arrow" d="M528 162h18"/>
  <g transform="translate(552 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">Capacitor</text>
    <text class="small" x="72" y="68" text-anchor="middle">50 µF</text>
  </g>
  <path class="arrow" d="M700 162h18"/>
  <g transform="translate(724 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">Boost</text>
    <text class="small" x="72" y="68" text-anchor="middle">Converter</text>
  </g>
  <path class="arrow" d="M872 162h18"/>
  <g transform="translate(896 104)">
    <rect class="step" width="144" height="116" rx="12"/>
    <text class="label" x="72" y="42" text-anchor="middle">TP4056</text>
    <text class="small" x="72" y="68" text-anchor="middle">Charging module</text>
  </g>
  <path class="arrow" d="M1044 162h18"/>
  <g transform="translate(1068 104)">
    <rect class="step" width="100" height="116" rx="12"/>
    <text class="label" x="50" y="42" text-anchor="middle">3.7 V</text>
    <text class="small" x="50" y="68" text-anchor="middle">Battery</text>
  </g>

  <g transform="translate(398 272)">
    <rect width="404" height="78" rx="12" fill="#132e27" stroke="#10b981" stroke-width="2"/>
    <text class="label" x="202" y="32" text-anchor="middle">ESP32 Development Board</text>
    <text class="small" x="202" y="56" text-anchor="middle">Monitoring and control unit · shown separately</text>
  </g>
  <text x="600" y="405" text-anchor="middle" font-size="13" fill="#fbbf24">FUNCTIONAL FLOW ONLY — NOT A WIRING SCHEMATIC</text>
  <text x="600" y="430" text-anchor="middle" font-size="12" fill="#cbd5e1">Verify charging input, cell compatibility, and protection requirements with the project supervisor.</text>
</svg>
