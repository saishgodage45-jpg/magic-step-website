<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="pw-title pw-desc">
  <title id="pw-title">Piezoelectric Working Principle &amp; Transduction Mechanism</title>
  <desc id="pw-desc">Scientific diagram illustrating direct piezoelectric effect under mechanical compression, crystal dipole displacement, and resulting electrical pulse response.</desc>
  <defs>
    <linearGradient id="pw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#111c2e" />
    </linearGradient>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pzt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <marker id="arr-force" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="1100" height="600" fill="url(#pw-bg)" rx="16" />

  <!-- Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
    <path d="M0,75 H1100 M0,150 H1100 M0,225 H1100 M0,300 H1100 M0,375 H1100 M0,450 H1100 M0,525 H1100" />
    <path d="M75,0 V600 M150,0 V600 M225,0 V600 M300,0 V600 M375,0 V600 M450,0 V600 M525,0 V600 M600,0 V600 M675,0 V600 M750,0 V600 M825,0 V600 M900,0 V600 M975,0 V600 M1050,0 V600" />
  </g>

  <!-- Title Header -->
  <rect x="40" y="30" width="1020" height="50" fill="#152136" rx="8" stroke="#2a3f60" stroke-width="1" />
  <text x="60" y="62" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">DIRECT PIEZOELECTRIC EFFECT — DIPOLE TRANSDUCTION UNDER FOOTFALL</text>

  <!-- PANEL 1: Unstressed State -->
  <g transform="translate(60, 110)">
    <rect width="450" height="420" fill="#141e30" stroke="#334155" stroke-width="1.5" rx="12" />
    <text x="225" y="35" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">STATE A: UNSTRESSED (AT REST)</text>
    <text x="225" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Centrosymmetric lattice · Net dipole moment = 0</text>

    <!-- Transducer Cross Section -->
    <!-- Top Electrode -->
    <rect x="100" y="100" width="250" height="12" fill="#94a3b8" rx="2" />
    <text x="360" y="110" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Silver Electrode (-)</text>

    <!-- PZT Ceramic Layer -->
    <rect x="100" y="112" width="250" height="70" fill="url(#pzt-grad)" stroke="#94a3b8" stroke-width="1" />
    <text x="225" y="152" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">PZT Ceramic Layer (0.2 mm)</text>

    <!-- Dipoles (symmetric) -->
    <g transform="translate(140, 125)">
      <circle cx="20" cy="10" r="7" fill="#3b82f6" /><text x="20" y="14" font-size="10" fill="#fff" text-anchor="middle">+</text>
      <circle cx="20" cy="30" r="7" fill="#ef4444" /><text x="20" y="34" font-size="10" fill="#fff" text-anchor="middle">-</text>

      <circle cx="90" cy="10" r="7" fill="#3b82f6" /><text x="90" y="14" font-size="10" fill="#fff" text-anchor="middle">+</text>
      <circle cx="90" cy="30" r="7" fill="#ef4444" /><text x="90" y="34" font-size="10" fill="#fff" text-anchor="middle">-</text>

      <circle cx="160" cy="10" r="7" fill="#3b82f6" /><text x="160" y="14" font-size="10" fill="#fff" text-anchor="middle">+</text>
      <circle cx="160" cy="30" r="7" fill="#ef4444" /><text x="160" y="34" font-size="10" fill="#fff" text-anchor="middle">-</text>
    </g>

    <!-- Brass Substrate -->
    <rect x="60" y="182" width="330" height="22" fill="url(#brass-grad)" stroke="#78350f" stroke-width="1" rx="2" />
    <text x="225" y="198" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#451a03" text-anchor="middle">Brass Substrate Plate ⌀27 mm (+)</text>

    <!-- Base Plate -->
    <rect x="40" y="220" width="370" height="25" fill="#3f2e18" stroke="#78350f" stroke-width="1" rx="4" />
    <text x="225" y="237" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef3c7" text-anchor="middle">Wooden Base Platform (10 mm)</text>

    <!-- Oscilloscope at 0V -->
    <g transform="translate(75, 270)">
      <rect width="300" height="100" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="50" x2="280" y2="50" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
      <path d="M20 50 H280" stroke="#10b981" stroke-width="2.5" fill="none" />
      <text x="30" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">V_out = 0.00 V</text>
      <text x="200" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">No Charge</text>
      <text x="150" y="85" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">Time (t) →</text>
    </g>

    <text x="225" y="400" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">No mechanical load · Dipoles balance internally</text>
  </g>

  <!-- PANEL 2: Stressed Under Footstep -->
  <g transform="translate(560, 110)">
    <rect width="480" height="420" fill="#141e30" stroke="#f59e0b" stroke-width="2" rx="12" />
    <text x="240" y="35" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle">STATE B: COMPRESSED UNDER FOOTSTEP</text>
    <text x="240" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fed7aa" text-anchor="middle">Asymmetric lattice distortion · Voltage V = -g33 · σ · t</text>

    <!-- Force Arrows -->
    <g stroke="#ef4444" stroke-width="3" marker-end="url(#arr-force)">
      <line x1="140" y1="75" x2="140" y2="96" />
      <line x1="240" y1="75" x2="240" y2="96" />
      <line x1="340" y1="75" x2="340" y2="96" />
    </g>
    <text x="240" y="73" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">FORCE F = 650 N</text>

    <!-- Compressed Transducer Cross Section -->
    <!-- Top Electrode -->
    <rect x="100" y="102" width="280" height="12" fill="#94a3b8" rx="2" />
    <text x="390" y="112" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f87171">- - - Charges</text>

    <!-- PZT Ceramic Layer (Compressed / Strained) -->
    <rect x="100" y="114" width="280" height="62" fill="url(#pzt-grad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="240" y="148" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Lattice Strain (Δt)</text>

    <!-- Dipoles (Shifted / Polarized) -->
    <g transform="translate(145, 124)">
      <circle cx="20" cy="8" r="7" fill="#ef4444" /><text x="20" y="12" font-size="10" fill="#fff" text-anchor="middle">-</text>
      <circle cx="20" cy="30" r="7" fill="#3b82f6" /><text x="20" y="34" font-size="10" fill="#fff" text-anchor="middle">+</text>

      <circle cx="95" cy="8" r="7" fill="#ef4444" /><text x="95" y="12" font-size="10" fill="#fff" text-anchor="middle">-</text>
      <circle cx="95" cy="30" r="7" fill="#3b82f6" /><text x="95" y="34" font-size="10" fill="#fff" text-anchor="middle">+</text>

      <circle cx="170" cy="8" r="7" fill="#ef4444" /><text x="170" y="12" font-size="10" fill="#fff" text-anchor="middle">-</text>
      <circle cx="170" cy="30" r="7" fill="#3b82f6" /><text x="170" y="34" font-size="10" fill="#fff" text-anchor="middle">+</text>
    </g>

    <!-- Brass Substrate (Curved slightly to show mechanical bending strain) -->
    <rect x="60" y="176" width="360" height="24" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1.5" rx="3" />
    <text x="240" y="193" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#451a03" text-anchor="middle">Brass Substrate + + + Charges</text>

    <!-- Base Plate -->
    <rect x="40" y="215" width="400" height="25" fill="#3f2e18" stroke="#78350f" stroke-width="1" rx="4" />
    <text x="240" y="232" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef3c7" text-anchor="middle">Rigid Reaction Plane (Wooden Base)</text>

    <!-- Oscilloscope Showing Sharp Pulse Peak -->
    <g transform="translate(85, 265)">
      <rect width="310" height="105" fill="#0f172a" rx="8" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="20" y1="70" x2="290" y2="70" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      <!-- Sharp transient waveform -->
      <path d="M20 70 L80 70 Q100 68 120 22 Q130 15 140 30 Q160 95 180 70 L290 70" stroke="#f59e0b" stroke-width="2.5" fill="none" />
      <text x="30" y="25" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b" font-weight="700">V_peak ≈ +28.4 V</text>
      <text x="210" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Transient AC</text>
      <text x="155" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Time (t) · Pulse Duration ~40 ms</text>
    </g>

    <text x="240" y="400" font-family="'Inter', sans-serif" font-size="12" fill="#fed7aa" text-anchor="middle">Compressive strain creates potential difference across electrodes</text>
  </g>

  <!-- Mathematical Footer Formula -->
  <g transform="translate(40, 545)">
    <rect width="1020" height="42" fill="#132135" stroke="#2563eb" stroke-width="1" rx="8" />
    <text x="510" y="571" font-family="'Space Grotesk', monospace" font-size="14" fill="#93c5fd" text-anchor="middle">
      Governing Equation: <tspan fill="#f59e0b" font-weight="700">V = - g₃₃ · σ · t</tspan>  |  Where <tspan fill="#fff">g₃₃</tspan> = piezoelectric voltage coefficient, <tspan fill="#fff">σ</tspan> = applied compressive stress (N/m²), <tspan fill="#fff">t</tspan> = ceramic thickness
    </text>
  </g>
</svg>