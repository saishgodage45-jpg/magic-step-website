<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="bat-title">
  <title id="bat-title">1S2P Lithium-Ion Battery Storage Experiment</title>
  <defs>
    <linearGradient id="bench4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1420" /><stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="cell" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" /><stop offset="50%" stop-color="#10b981" /><stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bench4)" rx="12" />

  <!-- Dual Cell Battery Holder -->
  <g transform="translate(250, 180)">
    <!-- Black Plastic Shell -->
    <rect width="500" height="380" fill="#1e293b" stroke="#475569" stroke-width="2.5" rx="14" />
    <rect x="20" y="20" width="460" height="340" fill="#0f172a" rx="10" />

    <!-- Cell Bay 1 -->
    <g transform="translate(70, 50)">
      <rect width="140" height="280" fill="url(#cell)" stroke="#065f46" stroke-width="2" rx="12" />
      <rect x="40" y="-12" width="60" height="15" fill="#94a3b8" rx="3" stroke="#475569" stroke-width="1" />
      <text x="70" y="130" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 70 130)">18650 Li-ion 3.7V</text>
      <text x="70" y="250" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">CELL A</text>
    </g>

    <!-- Cell Bay 2 -->
    <g transform="translate(290, 50)">
      <rect width="140" height="280" fill="url(#cell)" stroke="#065f46" stroke-width="2" rx="12" />
      <rect x="40" y="-12" width="60" height="15" fill="#94a3b8" rx="3" stroke="#475569" stroke-width="1" />
      <text x="70" y="130" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 70 130)">18650 Li-ion 3.7V</text>
      <text x="70" y="250" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">CELL B</text>
    </g>

    <!-- Parallel Bus Straps (Top + to +; Bottom - to -) -->
    <path d="M140,38 H360" stroke="#ef4444" stroke-width="6" fill="none" />
    <path d="M140,330 H360" stroke="#3b82f6" stroke-width="6" fill="none" />

    <!-- Terminal Wire Leads -->
    <path d="M360,38 H480 Q520,38 520,100" stroke="#ef4444" stroke-width="4" fill="none" />
    <path d="M360,330 H480 Q520,330 520,280" stroke="#3b82f6" stroke-width="4" fill="none" />
  </g>

  <!-- Multimeter Readout Box -->
  <g transform="translate(250, 600)">
    <rect width="500" height="85" fill="#132338" stroke="#10b981" stroke-width="1.5" rx="8" />
    <text x="25" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">1S2P PARALLEL CONFIGURATION (CONFIRMED):</text>
    <text x="25" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6ee7b7">Nominal: 3.70 V  |  Cutoff: 2.80 V  |  Full Charge: 4.20 V</text>
    <text x="25" y="73" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Requires single-cell (1S) charge management module. Cell matching required.</text>
  </g>

  <!-- Photo Metadata Stamp -->
  <rect x="50" y="40" width="460" height="45" fill="#0f172a" opacity="0.9" rx="6" stroke="#10b981" stroke-width="1" />
  <text x="70" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#10b981" font-weight="700">WORKSHOP LOG: STEP 07 · 1S2P 18650 LI-ION STORAGE PACK</text>
</svg>