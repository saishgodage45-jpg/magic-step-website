<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="eb-title">
  <title id="eb-title">ESP32 &amp; 16×2 LCD Telemetry Bench Integration</title>
  <defs>
    <linearGradient id="bench3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626" /><stop offset="100%" stop-color="#060d17" />
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bench3)" rx="12" />

  <!-- Breadboard -->
  <g transform="translate(120, 160)">
    <rect width="760" height="460" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="10" />
    <!-- Center Divider -->
    <rect x="0" y="220" width="760" height="20" fill="#cbd5e1" />
    
    <!-- Pin holes grid lines -->
    <g fill="#94a3b8" opacity="0.3">
      <circle cx="80" cy="50" r="2.5" /><circle cx="100" cy="50" r="2.5" /><circle cx="120" cy="50" r="2.5" /><circle cx="140" cy="50" r="2.5" /><circle cx="160" cy="50" r="2.5" />
      <circle cx="80" cy="80" r="2.5" /><circle cx="100" cy="80" r="2.5" /><circle cx="120" cy="80" r="2.5" /><circle cx="140" cy="80" r="2.5" /><circle cx="160" cy="80" r="2.5" />
    </g>

    <!-- ESP32 Module on Board -->
    <g transform="translate(80, 80)">
      <rect width="180" height="300" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8" />
      <!-- Metal Shield -->
      <rect x="25" y="40" width="130" height="150" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" rx="4" />
      <text x="90" y="100" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">ESP-WROOM-32</text>
      <text x="90" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1e293b" text-anchor="middle">DevKit V1</text>
      <!-- WiFi Antenna -->
      <rect x="50" y="10" width="80" height="22" fill="#d97706" rx="2" />
      <!-- Status LED -->
      <circle cx="40" cy="220" r="4" fill="#38bdf8" />
      <text x="55" y="224" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">PWR</text>
      <!-- Micro-USB port -->
      <rect x="65" y="275" width="50" height="25" fill="#475569" rx="3" />
    </g>

    <!-- 16x2 I2C Character LCD on Breadboard -->
    <g transform="translate(360, 90)">
      <rect width="340" height="190" fill="#064e3b" stroke="#047857" stroke-width="2.5" rx="8" />
      <!-- Bezel -->
      <rect x="20" y="25" width="300" height="110" fill="#022c22" rx="4" stroke="#065f46" stroke-width="1.5" />
      <!-- Liquid Crystal Lines -->
      <text x="40" y="68" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#6ee7b7" letter-spacing="1">STEPS: 0048 [*]</text>
      <text x="40" y="112" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#6ee7b7" letter-spacing="1">BAT: 3.84V IDLE</text>
      <text x="170" y="165" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle">16×2 I²C LCD · 0x27 BUS</text>
    </g>

    <!-- Signal Conditioning Resistors & Bridge (bottom right) -->
    <g transform="translate(360, 310)">
      <rect width="340" height="110" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="6" />
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="700">SIGNAL CONDITIONING BLOCK:</text>
      <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• DB107 Full-Wave Diode Bridge</text>
      <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">• 10 µF 50V Electrolytic Buffer</text>
      <text x="20" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">• 100kΩ/47kΩ Resistor Divider to GPIO 34</text>
    </g>

    <!-- Jumper Wires -->
    <path d="M260,195 Q310,130 360,150" stroke="#38bdf8" stroke-width="3" fill="none" /><!-- SDA -->
    <path d="M260,225 Q320,180 360,180" stroke="#f59e0b" stroke-width="3" fill="none" /><!-- SCL -->
    <path d="M260,255 Q300,320 360,340" stroke="#ef4444" stroke-width="3" fill="none" /><!-- VCC -->
    <path d="M260,285 Q300,360 360,380" stroke="#1e293b" stroke-width="3" fill="none" /><!-- GND -->
  </g>

  <!-- Photo Metadata Stamp -->
  <rect x="50" y="40" width="460" height="45" fill="#0f172a" opacity="0.9" rx="6" stroke="#38bdf8" stroke-width="1" />
  <text x="70" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="700">WORKSHOP LOG: STEP 06 · ESP32 DEVKIT V1 &amp; 16×2 LCD</text>
</svg>