<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="osc-title">
  <title id="osc-title">DSO Open-Circuit Pulse Response &amp; Testing Setup</title>
  <defs>
    <linearGradient id="bench5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1a" /><stop offset="100%" stop-color="#03070d" />
    </linearGradient>
    <linearGradient id="crt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" /><stop offset="100%" stop-color="#011b15" />
    </linearGradient>
  </defs>
  <rect width="1000" height="750" fill="url(#bench5)" rx="12" />

  <!-- Oscilloscope Chassis -->
  <g transform="translate(100, 120)">
    <rect width="800" height="520" fill="#1e293b" stroke="#475569" stroke-width="3" rx="14" />
    <rect x="25" y="25" width="750" height="470" fill="#0f172a" rx="8" />

    <!-- Screen Bezel -->
    <rect x="50" y="50" width="500" height="380" fill="url(#crt-grad)" stroke="#065f46" stroke-width="2" rx="6" />

    <!-- Oscilloscope Grid Lines (8 div × 10 div) -->
    <g stroke="#047857" stroke-width="0.8" opacity="0.45">
      <line x1="50" y1="97" x2="550" y2="97" /><line x1="50" y1="145" x2="550" y2="145" />
      <line x1="50" y1="192" x2="550" y2="192" /><line x1="50" y1="240" x2="550" y2="240" />
      <line x1="50" y1="287" x2="550" y2="287" /><line x1="50" y1="335" x2="550" y2="335" />
      <line x1="50" y1="382" x2="550" y2="382" />

      <line x1="100" y1="50" x2="100" y2="430" /><line x1="150" y1="50" x2="150" y2="430" />
      <line x1="200" y1="50" x2="200" y2="430" /><line x1="250" y1="50" x2="250" y2="430" />
      <line x1="300" y1="50" x2="300" y2="430" /><line x1="350" y1="50" x2="350" y2="430" />
      <line x1="400" y1="50" x2="400" y2="430" /><line x1="450" y1="50" x2="450" y2="430" />
      <line x1="500" y1="50" x2="500" y2="430" />
    </g>

    <!-- Center Crosshairs -->
    <line x1="50" y1="240" x2="550" y2="240" stroke="#10b981" stroke-width="1.2" opacity="0.7" />
    <line x1="300" y1="50" x2="300" y2="430" stroke="#10b981" stroke-width="1.2" opacity="0.7" />

    <!-- REALISTIC PIEZO TRANSIENT IMPACT WAVEFORM -->
    <!-- Yellow Trace (CH1: Raw AC Pulse) -->
    <path d="M50,240 L160,240 Q180,238 200,90 Q215,65 225,120 Q240,370 260,260 Q280,225 320,245 L550,240" stroke="#facc15" stroke-width="2.5" fill="none" />

    <!-- Cyan Trace (CH2: Rectified & Filtered Buffer V_cap) -->
    <path d="M50,340 L160,340 Q220,335 240,290 Q260,270 300,260 L550,250" stroke="#38bdf8" stroke-width="2.2" fill="none" />

    <!-- OSD Telemetry Text on Screen -->
    <text x="65" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#facc15">CH1: 5.00V/div</text>
    <text x="200" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">CH2: 2.00V/div</text>
    <text x="350" y="75" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">M: 10.0ms</text>
    <text x="470" y="75" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f87171">TRIG: 2.4V</text>

    <text x="65" y="415" font-family="'JetBrains Mono', monospace" font-size="13" fill="#facc15">V_pk = +27.6 V</text>
    <text x="220" y="415" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38bdf8">V_rect = +16.2 V</text>
    <text x="400" y="415" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Load: 10 MΩ DSO</text>

    <!-- Control Knobs and Buttons on Right -->
    <g transform="translate(580, 50)">
      <!-- Power button -->
      <circle cx="140" cy="30" r="14" fill="#10b981" stroke="#059669" stroke-width="2" />
      <text x="140" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#000" font-weight="700" text-anchor="middle">PWR</text>

      <!-- Big Knobs -->
      <circle cx="50" cy="110" r="28" fill="#334155" stroke="#475569" stroke-width="2" />
      <text x="50" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">VOLTS/DIV</text>

      <circle cx="140" cy="110" r="28" fill="#334155" stroke="#475569" stroke-width="2" />
      <text x="140" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">TIME/DIV</text>

      <!-- BNC Connectors -->
      <circle cx="50" cy="230" r="16" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="50" cy="230" r="6" fill="#0f172a" />
      <text x="50" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#facc15" text-anchor="middle">CH 1</text>

      <circle cx="140" cy="230" r="16" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="140" cy="230" r="6" fill="#0f172a" />
      <text x="140" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">CH 2</text>
    </g>
  </g>

  <!-- Photo Metadata Stamp -->
  <rect x="50" y="40" width="460" height="45" fill="#0f172a" opacity="0.9" rx="6" stroke="#facc15" stroke-width="1" />
  <text x="70" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#facc15" font-weight="700">EXPERIMENTAL LOG: STEP WAVEFORM TEST (DSO CAPTURE)</text>
</svg>