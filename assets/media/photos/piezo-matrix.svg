  <text x="70" y="68" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f59e0b" font-weight="700">WORKSHOP LOG: STEP 03 · 6× ⌀27mm PIEZO TRANSDUCERS (2×3)</text>
