<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="exp-title exp-desc">
  <title id="exp-title">Magic Step Exploded Assembly CAD View</title>
  <desc id="exp-desc">Technical exploded assembly diagram illustrating all individual components of the footstep power tile vertically separated along the central assembly axis.</desc>
  <defs>
    <linearGradient id="exp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#121b2d" />
    </linearGradient>
    <linearGradient id="gold-exp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="1200" height="850" fill="url(#exp-bg)" rx="16" />

  <!-- Blueprint Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
    <path d="M0,85 H1200 M0,170 H1200 M0,255 H1200 M0,340 H1200 M0,425 H1200 M0,510 H1200 M0,595 H1200 M0,680 H1200 M0,765 H1200" />
    <path d="M85,0 V850 M170,0 V850 M255,0 V850 M340,0 V850 M425,0 V850 M510,0 V850 M595,0 V850 M680,0 V850 M765,0 V850 M850,0 V850 M935,0 V850 M1020,0 V850 M1105,0 V850" />
  </g>

  <!-- Title Header -->
  <rect x="40" y="25" width="1120" height="50" fill="#131e33" rx="8" stroke="#2a3f60" stroke-width="1" />
  <text x="60" y="56" font-family="'Space Grotesk', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">EXPLODED MECHANICAL ASSEMBLY — COMPONENT STACK &amp; FASTENING AXIS</text>
  <text x="1130" y="55" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="end">DWG NO: MS-CAD-EXP-02</text>

  <!-- Vertical Assembly Centerline Guide -->
  <line x1="560" y1="90" x2="560" y2="780" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.4" />
  <text x="575" y="110" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" opacity="0.6">ASSEMBLY AXIS Z</text>

  <!-- PART 1: Top Tread Stepping Plate (Z = 130) -->
  <g transform="translate(560, 150)">
    <polygon points="0,35 240,-45 40,-125 -200,-45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <polygon points="-200,-45 0,35 0,50 -200,-30" fill="#0f172a" />
    <polygon points="0,35 240,-45 240,-30 0,50" fill="#334155" />
    <!-- Tread label -->
    <text x="0" y="-35" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">ITEM 01: Top Footstep Tread Plate</text>
    <text x="0" y="-18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Springless Impact Transfer Surface</text>
  </g>
  <!-- Callout Line 1 -->
  <line x1="770" y1="120" x2="880" y2="120" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="770" cy="120" r="3" fill="#38bdf8" />
  <rect x="890" y="100" width="240" height="42" fill="#0f1929" rx="4" stroke="#38bdf8" stroke-width="1" />
  <text x="905" y="125" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1. Upper Stepping Surface</text>

  <!-- PART 2: Rubber Force Distribution Buffer Pads (Z = 290) -->
  <g transform="translate(560, 290)">
    <!-- Row 1 -->
    <ellipse cx="-120" cy="-40" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="0" cy="-65" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="120" cy="-90" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <!-- Row 2 -->
    <ellipse cx="-60" cy="0" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="60" cy="-25" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <ellipse cx="180" cy="-50" rx="18" ry="8" fill="#475569" stroke="#1e293b" stroke-width="1" />
  </g>
  <!-- Callout Line 2 -->
  <line x1="390" y1="280" x2="260" y2="280" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="390" cy="280" r="3" fill="#94a3b8" />
  <rect x="20" y="260" width="230" height="42" fill="#0f1929" rx="4" stroke="#94a3b8" stroke-width="1" />
  <text x="35" y="285" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">2. 6× Elastomeric Damping Pads</text>

  <!-- PART 3: 6× Piezoelectric Ceramic Sensor Discs (Z = 420) -->
  <g transform="translate(560, 420)">
    <!-- Rear Row -->
    <g transform="translate(-130, -50)">
      <ellipse cx="0" cy="0" rx="34" ry="15" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="22" ry="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>
    <g transform="translate(0, -80)">
      <ellipse cx="0" cy="0" rx="34" ry="15" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="22" ry="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>
    <g transform="translate(130, -110)">
      <ellipse cx="0" cy="0" rx="34" ry="15" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="22" ry="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>

    <!-- Front Row -->
    <g transform="translate(-70, 5)">
      <ellipse cx="0" cy="0" rx="36" ry="16" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="24" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>
    <g transform="translate(60, -25)">
      <ellipse cx="0" cy="0" rx="36" ry="16" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="24" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>
    <g transform="translate(190, -55)">
      <ellipse cx="0" cy="0" rx="36" ry="16" fill="url(#gold-exp)" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="24" ry="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    </g>
  </g>
  <!-- Callout Line 3 -->
  <line x1="750" y1="410" x2="880" y2="410" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="750" cy="410" r="3" fill="#f59e0b" />
  <rect x="890" y="390" width="240" height="42" fill="#0f1929" rx="4" stroke="#f59e0b" stroke-width="1" />
  <text x="905" y="415" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">3. 6× ⌀27mm Piezo Discs (2×3)</text>

  <!-- PART 4: Compliant Double-Sided Adhesive Film (Z = 540) -->
  <g transform="translate(560, 530)">
    <ellipse cx="-130" cy="-40" rx="28" ry="12" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="0" cy="-65" rx="28" ry="12" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="130" cy="-90" rx="28" ry="12" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="-70" cy="5" rx="30" ry="13" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="60" cy="-20" rx="30" ry="13" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <ellipse cx="190" cy="-45" rx="30" ry="13" fill="#38bdf8" opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
  </g>
  <!-- Callout Line 4 -->
  <line x1="390" y1="520" x2="260" y2="520" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="390" cy="520" r="3" fill="#38bdf8" />
  <rect x="20" y="500" width="230" height="42" fill="#0f1929" rx="4" stroke="#38bdf8" stroke-width="1" />
  <text x="35" y="525" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">4. Compliant Double-Sided Tape</text>

  <!-- PART 5: Wooden Base Platform (300 × 160 × 10 mm) (Z = 680) -->
  <g transform="translate(560, 680)">
    <!-- Front-Left Face -->
    <polygon points="-260,80 0,170 0,195 -260,105" fill="#3a2713" stroke="#251809" stroke-width="1.5" />
    <!-- Front-Right Face -->
    <polygon points="0,170 300,70 300,95 0,195" fill="#52391c" stroke="#251809" stroke-width="1.5" />
    <!-- Top Face -->
    <polygon points="0,55 300,-45 40,-145 -260,-45" fill="#644929" stroke="#7c5c37" stroke-width="1.5" />
    
    <!-- Wire Channel Recesses -->
    <ellipse cx="0" cy="55" rx="10" ry="5" fill="#1e293b" />
    <text x="0" y="-30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">ITEM 05: Wooden Base Platform</text>
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef3c7" text-anchor="middle">300 mm × 160 mm × 10 mm</text>
  </g>
  <!-- Callout Line 5 -->
  <line x1="780" y1="670" x2="880" y2="670" stroke="#10b981" stroke-width="1.5" />
  <circle cx="780" cy="670" r="3" fill="#10b981" />
  <rect x="890" y="650" width="240" height="42" fill="#0f1929" rx="4" stroke="#10b981" stroke-width="1" />
  <text x="905" y="675" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#10b981">5. Base Plate (300 × 160 × 10 mm)</text>

  <!-- Assembly Notes Box -->
  <g transform="translate(60, 720)">
    <rect width="450" height="90" fill="#0f1929" stroke="#263a56" stroke-width="1" rx="6" />
    <text x="18" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">MECHANICAL NOTES &amp; STACK SEQUENCE:</text>
    <text x="18" y="45" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Piezo discs secured via high-shear acrylic double-sided adhesive.</text>
    <text x="18" y="62" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• Neoprene dampers isolate point stress; prevents brittle PZT ceramic fracture.</text>
    <text x="18" y="79" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">• No helical springs used; direct force transmission maximises energy yield.</text>
  </g>
</svg>